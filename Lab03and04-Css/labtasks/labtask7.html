<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Component Design</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Inter', sans-serif;
    background: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.card-container {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: white;
    border-radius: 15px;
    width: 260px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
}

.card-content {
    padding: 20px;
}

.card-content h3 {
    margin: 0 0 10px 0;
    color: #333;
    font-weight: 600;
}

.card-content p {
    font-size: 14px;
    color: #555;
    margin-bottom: 15px;
}

.card-content button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #6a11cb, #2575fc);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.card-content button:hover {
    background: linear-gradient(90deg, #2575fc, #6a11cb);
    transform: scale(1.05);
}
</style>
</head>
<body>

<div class="card-container">

<!-- Card 1 -->
<div class="card">
    <img src="https://picsum.photos/id/1050/400/300" alt="Product Image 1">
    <div class="card-content">
        <h3>Premium Laptop</h3>
        <p>High-performance laptop with sleek design and long battery life.</p>
        <button>Buy Now</button>
    </div>
</div>


</div>



</body>
</html>
