<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Styled Registration Form</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

form {
    background: white;
    padding: 35px 40px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    width: 320px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

.input-group {
    margin-bottom: 20px;
    position: relative;
}

.input-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 10px 15px;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-family: 'Roboto Mono', monospace;
    transition: 0.3s;
}

.input-group input:focus,
.input-group select:focus {
    border-color: #007bff;
    box-shadow: 0 0 8px rgba(0,123,255,0.3);
    outline: none;
}

.input-group.error input {
    border-color: #dc3545;
}

.input-group.error .error-msg {
    color: #dc3545;
    font-size: 13px;
    margin-top: 4px;
}

.input-group.success input {
    border-color: #28a745;
}

.input-group.success .success-msg {
    color: #28a745;
    font-size: 13px;
    margin-top: 4px;
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #6a11cb, #2575fc);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}
</style>
</head>

<body>

<form>
<h2>Register Account</h2>

<div class="input-group">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username">
    <div class="error-msg">Username required</div>
</div>

<div class="input-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter email">
    <div class="success-msg">Looks good!</div>
</div>

<div class="input-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password">
</div>

<div class="input-group">
    <label for="role">Select Role</label>
    <select id="role">
        <option value="">--Choose--</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
    </select>
</div>

<button type="submit">Sign Up</button>
</form>

</body>
</html>
