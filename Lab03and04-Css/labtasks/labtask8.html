<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navigation Menu Styling</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f6f8;
}

/* Top Navigation */

.topnav{
    background: linear-gradient(90deg,#2c3e50,#4ca1af);
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.topnav ul{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
}

.topnav li{
    position:relative;
}

.topnav a{
    display:block;
    padding:15px 22px;
    color:white;
    text-decoration:none;
    font-weight:500;
    transition:0.3s;
}

/* Hover + Active */

.topnav a:hover{
    background:rgba(255,255,255,0.2);
}

.topnav a.active{
    background:#1abc9c;
    border-radius:4px;
}

/* Dropdown Menu */

.dropdown-content{
    display:none;
    position:absolute;
    top:100%;
    left:0;
    background:white;
    min-width:170px;
    border-radius:6px;
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

.dropdown-content a{
    color:#333;
    padding:10px 15px;
}

.dropdown-content a:hover{
    background:#f1f1f1;
}

.dropdown:hover .dropdown-content{
    display:block;
}

/* Sidebar */

.sidebar{
    width:200px;
    background:white;
    margin:30px;
    border-radius:8px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    overflow:hidden;
}

.sidebar a{
    display:block;
    padding:12px 16px;
    text-decoration:none;
    color:#333;
    border-bottom:1px solid #eee;
    transition:0.3s;
}

.sidebar a:hover{
    background:#1abc9c;
    color:white;
}

/* Responsive */

@media (max-width:600px){

.topnav ul{
    flex-direction:column;
    align-items:center;
}

.sidebar{
    width:90%;
}

}

</style>
</head>

<body>

<!-- Horizontal Navigation -->

<nav class="topnav">
<ul>
<li><a class="active" href="#">Home</a></li>
<li><a href="#">About</a></li>

<li class="dropdown">
<a href="#">Services</a>

<div class="dropdown-content">
<a href="#">Web Design</a>
<a href="#">Development</a>
<a href="#">SEO</a>
</div>

</li>

<li><a href="#">Contact</a></li>
</ul>
</nav>

<br>

<!-- Vertical Navigation -->

<div class="sidebar">
<a href="#">Dashboard</a>
<a href="#">Profile</a>
<a href="#">Messages</a>
<a href="#">Settings</a>
<a href="#">Logout</a>
</div>

</body>
</html>
