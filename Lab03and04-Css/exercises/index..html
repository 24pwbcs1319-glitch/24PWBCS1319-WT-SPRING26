    <style>
      body {
        font-family: Georgia, serif;
        background: #f5f5f0;
        color: #222;
        max-width: 500px;
        margin: 80px auto;
        padding: 0 20px;
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 8px;
        border-bottom: 2px solid #222;
        padding-bottom: 8px;
      }

      p {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 28px;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        border-bottom: 1px solid #ddd;
      }

      li:first-child {
        border-top: 1px solid #ddd;
      }

      a {
        display: block;
        padding: 14px 4px;
        text-decoration: none;
        color: #222;
        font-size: 1rem;
        transition: padding-left 0.2s;
      }

      a:hover {
        padding-left: 12px;
        color: #0057b8;
      }
    </style>
