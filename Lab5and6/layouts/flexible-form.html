<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Responsive Form Layout</title>
  <style>
    :root {
      --ink: #0f172a;
      --sand: #f7f6f2;
      --mint: #d9f99d;
      --sun: #fcd34d;
      --border: rgba(15, 23, 42, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--sand);
      color: var(--ink);
      padding: 32px 16px 48px;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 24px 32px;
      border: 1px solid var(--border);
      box-shadow: 0 15px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin-top: 0;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 1.3rem;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input,
    select,
    textarea {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--mint);
    }

    .wide {
      grid-column: span 2;
    }

    .actions {
      grid-column: span 2;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    button {
      border:none;
      border-radius: 999px;
      background: var(--sun);
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .conditional {
      background: #fefce8;
      border-radius: 12px;
      padding: 14px;
      border:1px dashed var(--border);
    }

    @media (max-width: 900px) {
      form {
        grid-template-columns: 1fr;
      }

      .wide,
      .actions {
        grid-column: span 1;
      }
    }

    @media (max-width: 640px) {
      .conditional {
        display: block;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Form Layout</h1>
    <p>Flexible two-column form that becomes single column on mobile while keeping conditional sections visible.</p>
    <form>
      <div class="form-group">
        <label for="fname">Full name</label>
        <input type="text" id="fname" name="fname" placeholder="" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="" />
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="+92 " />
      </div>
      <div class="form-group">
        <label for="date">Start date</label>
        <input type="date" id="date" name="date" />
      </div>

      <div class="form-group wide">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3" placeholder="Tell us about your goals"></textarea>
      </div>

      <div class="form-group conditional wide">
        <label>Conditional section</label>
        <div class="form-group wide">
          <label for="newsletter">Interested in newsletter?</label>
          <select id="newsletter" name="newsletter">
            <option value="yes">Yes, send updates</option>
            <option value="no">No thanks</option>
          </select>
        </div>
        <div class="form-group wide">
          <label for="contact">Preferred contact</label>
          <select id="contact" name="contact">
            <option value="email">Email</option>
            <option value="phone">Phone</option>
          </select>
        </div>
      </div>

      <div class="actions wide">
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </div>
    </form>
  </div>
</body>
</html>
