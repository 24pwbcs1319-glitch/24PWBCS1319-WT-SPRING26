<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grid Gallery Task</title>
  <style>
    :root {
      --ink: #1a1c2c;
      --dust: #f7f5f0;
      --coral: #ff8a65;
      --sea: #6dd3ce;
      --border: rgba(26, 28, 44, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Manrope', 'Segoe UI', sans-serif;
      background: var(--dust);
      color: var(--ink);
      padding: 32px 16px 48px;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(3, 220px);
      gap: 18px;
      grid-template-areas:
        "a b"
        "c b"
        "c b";
    }

    .tile {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background-size: cover;
      background-position: center;
      min-height: 140px;
      display: flex;
      align-items: flex-end;
    }

    .tile::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(26, 28, 44, 0.45);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .tile:hover::after {
      opacity: 1;
    }

    .tile span {
      position: relative;
      padding: 12px 16px;
      font-weight: 600;
      z-index: 1;
    }

    .tile[data-area='a'] { grid-area: a; background-image: url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=600&q=60'); }
    .tile[data-area='b'] { grid-area: b; background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=60'); min-height: 420px; }
    .tile[data-area='c'] { grid-area: c; background-image: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=60'); min-height: 260px; }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "a"
          "b"
          "c";
      }

      .tile[data-area='b'] {
        min-height: 320px;
      }
    }

    @media (max-width: 640px) {
      .gallery {
        grid-template-columns: 1fr;
        grid-template-areas:
          "a"
          "b"
          "c";
      }

      .tile {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Grid Gallery</h1>
    <div class="gallery">
      <article class="tile" data-area="a">
        <span>Morning Light</span>
        <a href="#"></a>
      </article>
      <article class="tile" data-area="b">
        <span>City Lines</span>
        <a href="#"></a>
      </article>
      <article class="tile" data-area="c">
        <span>Forest Mist</span>
        <a href="#"></a>
      </article>
    </div>
  </div>
</body>
</html>
