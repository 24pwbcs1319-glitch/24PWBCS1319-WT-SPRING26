<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <style>
      :root {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #e5ecff;
        color: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #edf2ff 0%, #e2e8f0 60%, #fff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .hero {
        width: min(1100px, 100%);
        background: white;
        border-radius: 28px;
        padding: 2rem;
        box-shadow: 0 25px 50px rgba(15, 23, 42, 0.12);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 2rem;
        align-items: center;
      }

      .hero__content h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.6rem);
        color: #111827;
      }

      .hero__content p {
        color: #475569;
        line-height: 1.6;
      }

      .cta-list {
        margin: 1.25rem 0 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .cta {
        padding: 0.85rem 1.4rem;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        color: white;
        font-weight: 600;
        text-decoration: none;
      }

      .cta.secondary {
        background: transparent;
        color: #0f172a;
        border: 1px solid #cbd5f5;
      }

      .hero__image {
        display: flex;
        justify-content: center;
      }

      .image-frame {
        width: 260px;
        height: 260px;
        border-radius: 24px;
        overflow: hidden;
        border: 2px solid #e2e8f0;
        background: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .labs {
        margin-top: 1rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.75rem;
      }

      .labs a {
        padding: 0.9rem 1rem;
        border-radius: 14px;
        text-decoration: none;
        text-align: center;
        font-weight: 600;
        color: #0f172a;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .labs a:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
      }

      @media (max-width: 520px) {
        .hero {
          padding: 1.5rem;
        }

        .image-frame {
          width: 220px;
          height: 220px;
        }
      }
    </style>
  </head>

  <body>
    <section class="hero">
      <div class="hero__content">
        <h1>Welcome to the Web Technologies Lab</h1>
        <p>
          This landing page keeps the spotlight on your work—introduce yourself,
          highlight your key labs, and paste a portrait in the frame to keep the
          page personal and professional.
        </p>

        <div class="labs">
          <a href="Lab01/index.html">Lab 01</a>
          <a href="Lab02/index.html">Lab 02</a>
          <a href="Lab03/index.html">Lab 03 & 04</a>
        </div>
      </div>

      <div class="hero__image">
        <div class="image-frame" aria-label="Portfolio portrait">
          <img src="Lab02/Profile Picture.jpeg" alt="Portfolio placeholder" />
        </div>
      </div>
    </section>
  </body>
</html>
