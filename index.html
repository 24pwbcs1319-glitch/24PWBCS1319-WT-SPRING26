<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    background:white;
    padding:40px;
    border-radius:12px;
    width:420px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

h3{
    margin-top:20px;
    color:#333;
}

p{
    color:#555;
    line-height:1.6;
}

ul{
    list-style:none;
    padding:0;
}

ul li{
    margin:12px 0;
}

ul li a{
    display:block;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    background: linear-gradient(90deg,#4facfe,#00f2fe);
    color:white;
    font-weight:bold;
    transition:0.3s;
}

ul li a:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

</style>

</head>

<body>

<div class="container">

<p>
Welcome to the Web Lab! This is your landing page where you can access all

to Lab 01 and Lab 02.
</p>

</div>
